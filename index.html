<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>P2P リモートプレゼンター (スマホ対応)</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --panel-bg: #ffffff;
            --accent-color: #007bff;
            --text-dark: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-dark);
            box-sizing: border-box;
        }

        .view-section { display: none; }

        /* --- ホスト（PC/プロジェクター側）のスタイル --- */
        #host-window {
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        #setup-panel {
            background: var(--panel-bg);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            text-align: center;
        }
        #share-url {
            width: 60%;
            padding: 6px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 6px 14px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background: #0056b3; }
        
        #presentation-stage {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
        }

        /* --- ゲスト（スマホ/リモコン側）のスタイル --- */
        #guest-window {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            background: #1e222b;
            color: #fff;
            padding: 15px;
            touch-action: none;
        }
        .controller-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }
        .nav-btn {
            flex: 1;
            height: 60px;
            font-size: 18px;
            font-weight: bold;
            background: #2c313c;
            border: 1px solid #3e4451;
            color: #fff;
            border-radius: 8px;
        }
        .nav-btn:active { background: var(--accent-color); }
        
        #trackpad {
            flex: 1;
            background: #15181f;
            border: 2px dashed #3e4451;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6c757d;
            font-size: 14px;
            position: relative;
        }
        #trackpad-finger {
            position: absolute;
            width: 20px; height: 20px;
            background: rgba(0, 123, 255, 0.4);
            border: 2px solid var(--accent-color);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            display: none;
            pointer-events: none;
        }

        #memo-area {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
        #memo-input {
            flex: 1;
            padding: 10px;
            background: #2c313c;
            border: 1px solid #3e4451;
            color: #fff;
            border-radius: 6px;
            font-size: 14px;
        }
        #send-memo-btn {
            background: #28a745;
        }

        #status-bar {
            font-size: 12px;
            text-align: center;
            margin-bottom: 5px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <!-- ================= ホスト画面 (PC側) ================= -->
    <div id="host-window" class="view-section">
        <div id="setup-panel">
            <div style="margin-bottom: 8px;">ステータス: <span id="host-status" style="font-weight:bold; color:#ffc107;">初期化中...</span></div>
            <div id="link-area" style="display:none;">
                <span style="font-size: 14px;">スマホで開く用のリモコンリンク:</span>
                <input type="text" id="share-url" readonly>
                <button onclick="copyLink()">リンクをコピー</button>
            </div>
        </div>
        
        <div id="presentation-stage">
            <canvas id="slide-canvas" width="800" height="500"></canvas>
        </div>
    </div>

    <!-- ================= ゲスト画面 (スマホ側) ================= -->
    <div id="guest-window" class="view-section">
        <div id="status-bar">ステータス: <span id="guest-status" style="color:#ffc107;">接続中...</span></div>
        
        <div class="controller-row">
            <button class="nav-btn" id="prev-btn">◀ BACK</button>
            <button class="nav-btn" id="next-btn">NEXT ▶</button>
        </div>

        <div id="trackpad">
            ここに触れてスライドをポインティング
            <div id="trackpad-finger"></div>
        </div>

        <div id="memo-area">
            <input type="text" id="memo-input" placeholder="PC画面へメッセージを送信...">
            <button id="send-memo-btn">送信</button>
        </div>
    </div>

    <script>
        // --- 共通の接続設定 ---
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');
        const isHost = !roomId;

        let peer = null;
        let conn = null;

        // GitHub Pagesなどの環境で確実に通信を通すためのSTUNサーバー設定
        const peerConfig = {
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            }
        };

        const hostWindow = document.getElementById('host-window');
        const guestWindow = document.getElementById('guest-window');

        if (isHost) {
            hostWindow.style.display = 'block';
            initHost();
        } else {
            guestWindow.style.display = 'flex';
            initGuest();
        }

        // --- ホスト側（PC）の処理 ---
        let currentSlide = 0;
        let pointerPos = { x: 0, y: 0, active: false };
        let memoText = "";
        let memoTimer = 0;

        const slides = [
            { title: "1. P2P Webリモコンツール", desc: "WebRTCを使って、サーバーを介さずにスマホからダイレクトにPCを操作します。" },
            { title: "2. このシステムのメリット", desc: "端末間で直接データを同期するため、遅延が極めて少なく、機密性の高いプレゼンでも安心です。" },
            { title: "3. 応用できる機能アイデア", desc: "今回はポインターとスライド、テキスト同期ですが、スマホのジャイロ（傾き）同期なども実装可能です。" }
        ];

        function initHost() {
            const statusEl = document.getElementById('host-status');
            const linkArea = document.getElementById('link-area');
            const shareUrlInput = document.getElementById('share-url');

            // 確実な設定オブジェクトを渡して初期化
            peer = new Peer(peerConfig);

            peer.on('error', (err) => {
                statusEl.textContent = `接続エラー (${err.type})`;
                statusEl.style.color = '#dc3545';
                console.error('PeerJS Host Error:', err);
            });

            peer.on('open', (id) => {
                statusEl.textContent = 'スマホからの接続を待っています...';
                statusEl.style.color = '#ffc107';
                const inviteUrl = `${window.location.origin}${window.location.pathname}?room=${id}`;
                shareUrlInput.value = inviteUrl;
                linkArea.style.display = 'block';
            });

            peer.on('connection', (connection) => {
                conn = connection;
                statusEl.textContent = 'リモコンが接続されました！';
                statusEl.style.color = '#28a745';
                setupHostReceiver();
            });

            requestAnimationFrame(hostRenderLoop);
        }

        function setupHostReceiver() {
            conn.on('data', (data) => {
                if (data.type === 'nav') {
                    if (data.dir === 'next') currentSlide = Math.min(slides.length - 1, currentSlide + 1);
                    if (data.dir === 'prev') currentSlide = Math.max(0, currentSlide - 1);
                } else if (data.type === 'pointer') {
                    pointerPos.x = data.x * 800;
                    pointerPos.y = data.y * 500;
                    pointerPos.active = data.active;
                } else if (data.type === 'memo') {
                    memoText = data.text;
                    memoTimer = 180;
                }
            });
        }

        function hostRenderLoop() {
            const canvas = document.getElementById('slide-canvas');
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#e9ecef';
            ctx.lineWidth = 4;
            ctx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20);

            const slide = slides[currentSlide];
            ctx.fillStyle = '#1e222b';
            ctx.font = 'bold 32px sans-serif';
            ctx.fillText(slide.title, 50, 100);

            ctx.fillStyle = '#495057';
            ctx.font = '20px sans-serif';
            wrapText(ctx, slide.desc, 50, 180, 700, 32);

            ctx.fillStyle = '#adb5bd';
            ctx.font = '14px monospace';
            ctx.fillText(`PAGE: ${currentSlide + 1} / ${slides.length}`, 50, 450);

            if (memoTimer > 0) {
                memoTimer--;
                ctx.save();
                ctx.fillStyle = 'rgba(40, 167, 69, 0.9)';
                ctx.fillRect(50, 350, 700, 50);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 16px sans-serif';
                ctx.fillText(`手元からのメモ: ${memoText}`, 70, 380);
                ctx.restore();
            }

            if (pointerPos.active) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(pointerPos.x, pointerPos.y, 12, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 0, 0, 0.3)';
                ctx.fill();
                
                ctx.beginPath();
                ctx.arc(pointerPos.x, pointerPos.y, 4, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 0, 0, 1)';
                ctx.fill();
                ctx.restore();
            }

            requestAnimationFrame(hostRenderLoop);
        }

        function wrapText(context, text, x, y, maxWidth, lineHeight) {
            const words = text.split('');
            let line = '';
            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n];
                let metrics = context.measureText(testLine);
                if (metrics.width > maxWidth && n > 0) {
                    context.fillText(line, x, y);
                    line = words[n];
                    y += lineHeight;
                } else {
                    line = testLine;
                }
            }
            context.fillText(line, x, y);
        }

        function copyLink() {
            const copyText = document.getElementById("share-url");
            copyText.select();
            document.execCommand("copy");
            alert("リモコン用URLをコピーしました。スマホに送って開いてください！");
        }


        // --- ゲスト側（スマホ）の処理 ---
        const trackpad = document.getElementById('trackpad');
        const fingerMarker = document.getElementById('trackpad-finger');
        const statusGuestEl = document.getElementById('guest-status');

        function initGuest() {
            // 確実な設定オブジェクトを渡して初期化
            peer = new Peer(peerConfig);

            peer.on('error', (err) => {
                statusGuestEl.textContent = `通信エラー (${err.type})`;
                statusGuestEl.style.color = '#dc3545';
                console.error('PeerJS Guest Error:', err);
            });

            peer.on('open', () => {
                conn = peer.connect(roomId);
                
                conn.on('open', () => {
                    statusGuestEl.textContent = 'PCに接続完了';
                    statusGuestEl.style.color = '#28a745';
                });

                conn.on('close', () => {
                    statusGuestEl.textContent = '切断されました';
                    statusGuestEl.style.color = '#dc3545';
                });
            });

            document.getElementById('prev-btn').addEventListener('click', () => sendAction('nav', { dir: 'prev' }));
            document.getElementById('next-btn').addEventListener('click', () => sendAction('nav', { dir: 'next' }));
            document.getElementById('send-memo-btn').addEventListener('click', sendMemo);

            const handleTouch = (e) => {
                if (!conn || !conn.open) return;
                if (e.touches.length === 0) return;

                const touch = e.touches[0];
                const rect = trackpad.getBoundingClientRect();

                let relX = (touch.clientX - rect.left) / rect.width;
                let relY = (touch.clientY - rect.top) / rect.height;

                relX = Math.max(0, Math.min(1, relX));
                relY = Math.max(0, Math.min(1, relY));

                fingerMarker.style.display = 'block';
                fingerMarker.style.left = `${relX * 100}%`;
                fingerMarker.style.top = `${relY * 100}%`;

                conn.send({
                    type: 'pointer',
                    x: relX,
                    y: relY,
                    active: true
                });
            };

            trackpad.addEventListener('touchstart', (e) => { e.preventDefault(); handleTouch(e); }, { passive: false });
            trackpad.addEventListener('touchmove', (e) => { e.preventDefault(); handleTouch(e); }, { passive: false });
            
            const endTouch = () => {
                fingerMarker.style.display = 'none';
                if (conn && conn.open) {
                    conn.send({ type: 'pointer', x: 0, y: 0, active: false });
                }
            };
            trackpad.addEventListener('touchend', endTouch);
            trackpad.addEventListener('touchcancel', endTouch);
        }

        function sendAction(type, payload) {
            if (conn && conn.open) {
                conn.send({ type, ...payload });
            }
        }

        function sendMemo() {
            const input = document.getElementById('memo-input');
            const text = input.value.trim();
            if (text && conn && conn.open) {
                conn.send({ type: 'memo', text: text });
                input.value = '';
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Synchronous Sphere: Multi-Phase</title>
    <style>
        :root { --bg: #0a0a0c; --accent: #00f2ff; --warn: #ff0055; }
        body { margin: 0; padding: 0; background: var(--bg); color: #fff; font-family: sans-serif; overflow: hidden; touch-action: none; }
        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        canvas { width: 100%; height: 100%; }
        #ui { position: absolute; top: 50px; width: 80%; pointer-events: none; text-align: center; }
        .gauge-bar { width: 100%; height: 6px; background: #222; border-radius: 3px; overflow: hidden; margin-top: 10px; }
        #stability-fill { width: 20%; height: 100%; background: var(--accent); transition: width 0.3s; }
        #msg { font-size: 1.2rem; font-weight: bold; opacity: 0; transition: opacity 0.5s; }
        
        #menu { position: absolute; inset: 0; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
        .mode-btn { width: 200px; padding: 15px; margin: 10px; border: 1px solid var(--accent); background: transparent; color: var(--accent); font-size: 1rem; cursor: pointer; border-radius: 4px; }
        .mode-btn:active { background: var(--accent); color: #000; }
        #tutorial { position: absolute; bottom: 80px; font-size: 0.8rem; color: #666; text-align: center; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="menu">
            <h2 style="color:var(--accent)">SYNCHRONOUS SPHERE</h2>
            <button class="mode-btn" onclick="startGame('EASY')">EASY (同調容易)</button>
            <button class="mode-btn" onclick="startGame('NORMAL')">NORMAL (標準同調)</button>
            <button class="mode-btn" onclick="startGame('HARD')">HARD (高速同調)</button>
            <button class="mode-btn" onclick="startGame('HELL')" style="color:var(--warn); border-color:var(--warn)">HELL (極限同調)</button>
        </div>
        <div id="ui">
            <div id="msg">READY</div>
            <div class="gauge-bar"><div id="stability-fill"></div></div>
        </div>
        <canvas id="canvas"></canvas>
        <div id="tutorial">中心の輪と「同じ大きさ」になる瞬間に指を離せ</div>
    </div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const stabilityFill = document.getElementById('stability-fill');
const msgLabel = document.getElementById('msg');
const menu = document.getElementById('menu');

let width, height, targetBaseSize;
let stability = 20;
let isPressing = false;
let playerRadius = 0;
let targetRadius = 0;
let phase = 0;
let gameState = 'MENU'; 

// モード別パラメータ
const MODES = {
    EASY:   { speed: 1.5, tolerance: 120, penalty: 10, bonus: 20 },
    NORMAL: { speed: 3.0, tolerance: 150, penalty: 20, bonus: 15 },
    HARD:   { speed: 5.0, tolerance: 200, penalty: 30, bonus: 10 },
    HELL:   { speed: 8.0, tolerance: 300, penalty: 50, bonus: 8 }
};
let currentMode = MODES.NORMAL;

function init() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    targetBaseSize = Math.min(width, height) * 0.35;
}

function startGame(modeKey) {
    currentMode = MODES[modeKey];
    stability = 20;
    stabilityFill.style.width = '20%';
    gameState = 'PLAY';
    menu.style.display = 'none';
    resetTarget();
}

function resetTarget() {
    playerRadius = 0;
    phase = Math.random() * Math.PI * 2;
}

window.addEventListener('touchstart', (e) => {
    if(gameState !== 'PLAY') return;
    isPressing = true;
}, {passive: false});

window.addEventListener('touchend', (e) => {
    if(!isPressing) return;
    isPressing = false;
    checkSync();
}, {passive: false});

function checkSync() {
    const diff = Math.abs(playerRadius - targetRadius);
    // 難易度によって判定の厳しさを変える
    const accuracy = Math.max(0, 100 - (diff / targetRadius * currentMode.tolerance));
    
    if (accuracy > 88) {
        stability += currentMode.bonus;
        showMsg("EXCELLENT", "#00f2ff");
    } else if (accuracy > 65) {
        stability += currentMode.bonus * 0.4;
        showMsg("GOOD", "#fff");
    } else {
        stability -= currentMode.penalty;
        showMsg("MISMATCH", "#ff0055");
    }
    
    stability = Math.min(100, Math.max(0, stability));
    stabilityFill.style.width = `${stability}%`;
    
    if (stability >= 100) {
        finishGame("SYNCHRONIZED");
    } else if (stability <= 0) {
        finishGame("COLLAPSED");
    }
    resetTarget();
}

function showMsg(text, color) {
    msgLabel.innerText = text;
    msgLabel.style.color = color;
    msgLabel.style.opacity = 1;
    setTimeout(() => { msgLabel.style.opacity = 0; }, 600);
}

function finishGame(resultText) {
    gameState = 'MENU';
    setTimeout(() => {
        menu.style.display = 'flex';
        msgLabel.innerText = resultText;
        msgLabel.style.opacity = 1;
    }, 1000);
}

function update() {
    ctx.clearRect(0, 0, width, height);
    if(gameState !== 'PLAY') {
        requestAnimationFrame(update);
        return;
    }

    const centerX = width / 2;
    const centerY = height / 2;
    const time = Date.now() / 1000;

    // 難易度に応じたスピードで変化
    const pulse = Math.sin(time * currentMode.speed + phase) * 0.3 + 0.7;
    targetRadius = targetBaseSize * pulse;

    // ターゲット外郭
    ctx.beginPath();
    ctx.arc(centerX, centerY, targetRadius, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
    ctx.setLineDash([5, 5]); // 点線で「不安定さ」を表現
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.setLineDash([]);

    // プレイヤーの拡張
    if (isPressing) {
        playerRadius += 5; 
        if (playerRadius > Math.max(width, height)) playerRadius = 0;
        
        ctx.beginPath();
        ctx.arc(centerX, centerY, playerRadius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0, 242, 255, 0.2)';
        ctx.fill();
        ctx.strokeStyle = 'var(--accent)';
        ctx.lineWidth = 4;
        ctx.stroke();
        
        // 中心からのガイド光
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + playerRadius, centerY);
        ctx.strokeStyle = 'rgba(0, 242, 255, 0.5)';
        ctx.stroke();
    }

    requestAnimationFrame(update);
}

window.addEventListener('resize', init);
init();
update();
</script>
</body>
</html>

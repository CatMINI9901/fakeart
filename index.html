<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>詐欺電話撃退ジェネレーター</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    body {
      background-color: #0b0c10;
      color: #c5c6c7;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .container {
      background: #1f2833;
      border: 1px solid #45a29e;
      border-radius: 8px;
      padding: 30px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
      text-align: center;
    }
    h1 {
      color: #66fcf1;
      font-size: 1.4rem;
      margin-top: 0;
      margin-bottom: 20px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border-bottom: 1px solid #45a29e;
      padding-bottom: 10px;
    }
    p {
      font-size: 0.85rem;
      color: #c5c6c7;
      line-height: 1.5;
      margin-bottom: 25px;
    }
    button {
      background: #0b0c10;
      color: #66fcf1;
      border: 1px solid #66fcf1;
      padding: 16px 20px;
      font-size: 1rem;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s ease;
      width: 100%;
    }
    button:hover {
      background: #66fcf1;
      color: #0b0c10;
    }
    button.active {
      background: #c53030;
      border-color: #fc8181;
      color: #fff;
      box-shadow: 0 0 12px rgba(252, 129, 129, 0.6);
    }
    .status {
      margin-top: 20px;
      font-size: 0.85rem;
      color: #45a29e;
      min-height: 1.5em;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>撃退オーディオ</h1>
    <p>ボタンを押すと、ヒンディー語風の不気味な唱え声がランダムな組み合わせと間隔で再生され続けます。</p>
    
    <button id="togglePlayBtn">音声再生を開始</button>

    <div class="status" id="statusText">待機中</div>
  </div>

  <script>
    const synth = window.speechSynthesis;
    const togglePlayBtn = document.getElementById('togglePlayBtn');
    const statusText = document.getElementById('statusText');

    let isPlaying = false;
    let timerId = null;

    const syllables = [
      "アタル ヴァカル ナマハ",
      "ブラマ カパラ ダーラナ",
      "サンハラ ヴァジュラ スートラ",
      "タパ スヴァーハー ラーフ",
      "ケーテュ ダーラ チャクラ",
      "マントラ ヤーナ アグニ",
      "ヴィシュヌ ターラ シャクティ",
      "カーラ タイム ケーララ",
      "ドゥルガ バフラ プリヤ",
      "オーム ナモー ヴァルナ"
    ];

    function generatePseudoHindi() {
      const count = Math.floor(Math.random() * 3) + 2;
      let result = [];
      for (let i = 0; i < count; i++) {
        const randomIndex = Math.floor(Math.random() * syllables.length);
        result.push(syllables[randomIndex]);
      }
      return result.join(" ... ");
    }

    function speakNext() {
      if (!isPlaying) return;

      const text = generatePseudoHindi();
      const utterance = new SpeechSynthesisUtterance(text);

      utterance.lang = 'hi-IN';
      utterance.pitch = 0.45 + Math.random() * 0.25;
      utterance.rate = 0.65 + Math.random() * 0.2;

      utterance.onstart = () => {
        if (isPlaying) statusText.textContent = "発唱中...";
      };

      utterance.onend = () => {
        if (!isPlaying) return;
        statusText.textContent = "待機中（不気味な間）...";
        const delay = Math.floor(Math.random() * 2500) + 1000;
        timerId = setTimeout(speakNext, delay);
      };

      utterance.onerror = () => {
        if (isPlaying) {
          timerId = setTimeout(speakNext, 2000);
        }
      };

      synth.speak(utterance);
    }

    togglePlayBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;

      if (isPlaying) {
        togglePlayBtn.textContent = "音声再生を停止";
        togglePlayBtn.classList.add('active');
        speakNext();
      } else {
        togglePlayBtn.textContent = "音声再生を開始";
        togglePlayBtn.classList.remove('active');
        statusText.textContent = "停止しました";
        if (timerId) clearTimeout(timerId);
        synth.cancel();
      }
    });
  </script>
</body>
</html>

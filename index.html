<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>美術鑑定士 - 偽物を見破れ！</title>
    <style>
        :root {
            --bg-color: #1a181b;
            --card-bg: #2b262d;
            --accent-color: #d4af37;
            --text-color: #f3ebd9;
            --error-color: #e74c3c;
            --success-color: #2ecc71;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 12px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Georgia', 'Hiragino Mincho ProN', 'Yu Mincho', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            margin: 5px 0;
            color: var(--accent-color);
            font-size: clamp(1.4rem, 5vw, 2rem);
            text-align: center;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: clamp(0.75rem, 3vw, 0.9rem);
            color: #a09585;
            margin-bottom: 15px;
            text-align: center;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 680px;
            background: var(--card-bg);
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid var(--accent-color);
            margin-bottom: 15px;
            font-size: clamp(0.85rem, 3.5vw, 1.1rem);
            font-weight: bold;
        }

        .gallery {
            display: flex;
            gap: 15px;
            justify-content: center;
            width: 100%;
            max-width: 680px;
            flex-direction: row; /* パソコン等 */
        }

        /* スマホ・縦画面対応 */
        @media (max-width: 600px) {
            .gallery {
                flex-direction: column;
                align-items: center;
            }
        }

        .artwork-card {
            background: var(--card-bg);
            padding: 12px;
            border-radius: 12px;
            border: 2px solid #443c47;
            text-align: center;
            cursor: pointer;
            transition: transform 0.15s, border-color 0.15s;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 300px;
            touch-action: manipulation;
        }

        .artwork-card:active {
            transform: scale(0.98);
            border-color: var(--accent-color);
        }

        .canvas-frame {
            border: 8px solid #5c4033;
            border-image: linear-gradient(to bottom right, #8b5a2b, #3d2314) 1;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
            margin-bottom: 8px;
            background: #fff;
            aspect-ratio: 1 / 1;
            width: 100%;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .card-label {
            font-size: 1rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .message-area {
            margin-top: 15px;
            min-height: 48px;
            font-size: clamp(0.9rem, 3.5vw, 1.1rem);
            font-weight: bold;
            text-align: center;
            padding: 0 10px;
            line-height: 1.4;
        }

        .correct { color: var(--success-color); }
        .wrong { color: var(--error-color); }

        .btn {
            background: var(--accent-color);
            color: #111;
            border: none;
            padding: 12px 32px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 10px rgba(212, 175, 55, 0.3);
            touch-action: manipulation;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .instructions {
            max-width: 680px;
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            font-size: clamp(0.75rem, 2.8vw, 0.85rem);
            line-height: 1.5;
            color: #ccc;
        }
    </style>
</head>
<body>

    <h1>美術鑑定士 (Art Inspector)</h1>
    <div class="subtitle">比較して偽物（贋作）だと思う作品をタップ！</div>

    <div class="status-bar">
        <div>STAGE: <span id="stage-val">1</span> / 5</div>
        <div>SCORE: <span id="score-val">0</span></div>
        <div>TIME: <span id="timer-val">15</span>s</div>
    </div>

    <div class="gallery">
        <div class="artwork-card" id="card-left" onclick="makeGuess('left')">
            <div class="canvas-frame">
                <canvas id="canvas-left" width="280" height="280"></canvas>
            </div>
            <div class="card-label">作品 A</div>
        </div>

        <div class="artwork-card" id="card-right" onclick="makeGuess('right')">
            <div class="canvas-frame">
                <canvas id="canvas-right" width="280" height="280"></canvas>
            </div>
            <div class="card-label">作品 B</div>
        </div>
    </div>

    <div class="message-area" id="message"></div>

    <button class="btn" id="next-btn" style="display:none;" onclick="nextStage()">次の鑑定へ</button>

    <div class="instructions">
        <strong>【ルール】</strong><br>
        片方は本物、もう片方は巧妙な<b>偽物（色違い・要素の追加/消失・形状変化など）</b>です。<br>
        制限時間内に偽物をタップしてください。素早く正解するほど高得点を獲得できます。
    </div>

    <script>
        const TOTAL_STAGES = 5;
        let currentStage = 1;
        let score = 0;
        let fakeSide = '';
        let fakeReason = '';
        let timer = null;
        let timeLeft = 15;
        let isAnswered = false;

        const artThemes = [
            // テーマ1: 富士と夕焼け
            {
                name: "富士の夕景",
                draw: (ctx, isFake) => {
                    let grad = ctx.createLinearGradient(0, 0, 0, 280);
                    grad.addColorStop(0, isFake && isFake.type === 'sky' ? '#e67e22' : '#d35400');
                    grad.addColorStop(1, '#f1c40f');
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, 280, 280);

                    ctx.fillStyle = isFake && isFake.type === 'sun_color' ? '#e74c3c' : '#ffffff';
                    ctx.beginPath();
                    ctx.arc(200, 80, isFake && isFake.type === 'sun_size' ? 45 : 30, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#2c3e50';
                    ctx.beginPath();
                    ctx.moveTo(30, 280);
                    ctx.lineTo(140, 100);
                    ctx.lineTo(250, 280);
                    ctx.fill();

                    if (!(isFake && isFake.type === 'no_snow')) {
                        ctx.fillStyle = '#ecf0f1';
                        ctx.beginPath();
                        ctx.moveTo(140, 100);
                        ctx.lineTo(118, 130);
                        ctx.lineTo(162, 130);
                        ctx.fill();
                    }

                    let birdCount = (isFake && isFake.type === 'birds') ? 5 : 3;
                    ctx.strokeStyle = '#2c3e50';
                    ctx.lineWidth = 3;
                    for(let i = 0; i < birdCount; i++) {
                        let bx = 50 + i * 25;
                        let by = 60 + (i % 2) * 10;
                        ctx.beginPath();
                        ctx.arc(bx, by, 8, Math.PI, 0);
                        ctx.arc(bx + 12, by, 8, Math.PI, 0);
                        ctx.stroke();
                    }
                },
                fakes: [
                    { type: 'sun_color', desc: '太陽の色が白ではなく赤くなっている！' },
                    { type: 'sun_size', desc: '太陽の大きさが肥大化している！' },
                    { type: 'no_snow', desc: '山頂の雪が消失している！' },
                    { type: 'birds', desc: '飛んでいる鳥の数が増えている！' }
                ]
            },
            // テーマ2: 星降る夜空
            {
                name: "星月夜の幻想",
                draw: (ctx, isFake) => {
                    ctx.fillStyle = '#0f2027';
                    ctx.fillRect(0, 0, 280, 280);

                    ctx.fillStyle = isFake && isFake.type === 'moon_color' ? '#e74c3c' : '#f1c40f';
                    ctx.beginPath();
                    let moonX = (isFake && isFake.type === 'moon_pos') ? 220 : 60;
                    ctx.arc(moonX, 60, 25, 0, Math.PI * 2);
                    ctx.fill();

                    let starCount = (isFake && isFake.type === 'more_stars') ? 12 : 6;
                    ctx.fillStyle = '#ffffff';
                    for(let i=0; i<starCount; i++) {
                        let x = (i * 47) % 240 + 20;
                        let y = (i * 83) % 180 + 20;
                        ctx.beginPath();
                        ctx.arc(x, y, (i % 2 === 0) ? 3 : 5, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    ctx.fillStyle = '#000000';
                    ctx.fillRect(0, 220, 280, 60);
                    ctx.fillRect(40, 180, 30, 40);
                    ctx.fillRect(180, 170, 40, 50);
                    
                    if (isFake && isFake.type === 'flat_roof') {
                        ctx.fillRect(110, 160, 30, 60);
                    } else {
                        ctx.beginPath();
                        ctx.moveTo(110, 220);
                        ctx.lineTo(125, 140);
                        ctx.lineTo(140, 220);
                        ctx.fill();
                    }
                },
                fakes: [
                    { type: 'moon_color', desc: '月の色が不気味な赤色になっている！' },
                    { type: 'moon_pos', desc: '月の配置が左右反転している！' },
                    { type: 'more_stars', desc: '星の数が異常に増殖している！' },
                    { type: 'flat_roof', desc: '中央の塔の尖がり屋根が平らになっている！' }
                ]
            },
            // テーマ3: 幾何学モダンアート
            {
                name: "コンポジション・III",
                draw: (ctx, isFake) => {
                    ctx.fillStyle = '#f4f1ea';
                    ctx.fillRect(0, 0, 280, 280);

                    ctx.fillStyle = '#111111';
                    ctx.fillRect(80, 0, 12, 280);
                    ctx.fillRect(0, 180, 280, 12);

                    ctx.fillStyle = isFake && isFake.type === 'color_swap' ? '#3498db' : '#e74c3c';
                    ctx.fillRect(92, 0, 188, 180);

                    ctx.fillStyle = isFake && isFake.type === 'color_swap' ? '#e74c3c' : '#3498db';
                    ctx.fillRect(0, 192, 80, 88);

                    if (!(isFake && isFake.type === 'missing_yellow')) {
                        ctx.fillStyle = '#f1c40f';
                        ctx.fillRect(230, 192, 50, 88);
                    }

                    if (isFake && isFake.type === 'extra_circle') {
                        ctx.fillStyle = '#2ecc71';
                        ctx.beginPath();
                        ctx.arc(40, 90, 25, 0, Math.PI * 2);
                        ctx.fill();
                    }
                },
                fakes: [
                    { type: 'color_swap', desc: '赤と青のブロックの色が逆転している！' },
                    { type: 'missing_yellow', desc: '右下の黄色のブロックが塗りつぶされていない！' },
                    { type: 'extra_circle', desc: '原作にない緑色の円が描き加えられている！' }
                ]
            },
            // テーマ4: 貴婦人像
            {
                name: "緑の髪飾りの肖像",
                draw: (ctx, isFake) => {
                    ctx.fillStyle = '#4a3b52';
                    ctx.fillRect(0, 0, 280, 280);

                    ctx.fillStyle = '#f5d6ba';
                    ctx.beginPath();
                    ctx.ellipse(140, 140, 50, 70, 0, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#2c3e50';
                    ctx.beginPath();
                    ctx.arc(120, 130, 6, 0, Math.PI * 2);
                    ctx.arc(160, 130, 6, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.strokeStyle = '#c0392b';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    if (isFake && isFake.type === 'sad_mouth') {
                        ctx.arc(140, 175, 12, Math.PI, 0);
                    } else {
                        ctx.arc(140, 160, 12, 0, Math.PI);
                    }
                    ctx.stroke();

                    ctx.fillStyle = isFake && isFake.type === 'gem_color' ? '#e67e22' : '#2ecc71';
                    ctx.beginPath();
                    ctx.arc(140, 75, isFake && isFake.type === 'no_gem' ? 0 : 12, 0, Math.PI * 2);
                    ctx.fill();

                    if (!(isFake && isFake.type === 'no_necklace')) {
                        ctx.strokeStyle = '#f1c40f';
                        ctx.lineWidth = 4;
                        ctx.beginPath();
                        ctx.arc(140, 185, 30, 0.2, Math.PI - 0.2);
                        ctx.stroke();
                    }
                },
                fakes: [
                    { type: 'sad_mouth', desc: '貴婦人の口角が下がって不機嫌になっている！' },
                    { type: 'gem_color', desc: '髪飾りのエメラルドがオレンジ色の宝石に変えられている！' },
                    { type: 'no_necklace', desc: '首のゴールドネックレスが消失している！' }
                ]
            }
        ];

        function startStage() {
            isAnswered = false;
            document.getElementById('message').textContent = '';
            document.getElementById('message').className = 'message-area';
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('card-left').style.pointerEvents = 'auto';
            document.getElementById('card-right').style.pointerEvents = 'auto';

            const theme = artThemes[(currentStage - 1) % artThemes.length];
            const fakeSpec = theme.fakes[Math.floor(Math.random() * theme.fakes.length)];
            
            fakeSide = Math.random() < 0.5 ? 'left' : 'right';
            fakeReason = fakeSpec.desc;

            const canvasLeft = document.getElementById('canvas-left');
            const canvasRight = document.getElementById('canvas-right');
            const ctxLeft = canvasLeft.getContext('2d');
            const ctxRight = canvasRight.getContext('2d');

            ctxLeft.clearRect(0, 0, 280, 280);
            ctxRight.clearRect(0, 0, 280, 280);

            if (fakeSide === 'left') {
                theme.draw(ctxLeft, fakeSpec);
                theme.draw(ctxRight, null);
            } else {
                theme.draw(ctxLeft, null);
                theme.draw(ctxRight, fakeSpec);
            }

            timeLeft = 15;
            document.getElementById('timer-val').textContent = timeLeft;
            clearInterval(timer);
            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-val').textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    timeOut();
                }
            }, 1000);
        }

        function makeGuess(side) {
            if (isAnswered) return;
            isAnswered = true;
            clearInterval(timer);

            const msgEl = document.getElementById('message');
            document.getElementById('card-left').style.pointerEvents = 'none';
            document.getElementById('card-right').style.pointerEvents = 'none';

            if (side === fakeSide) {
                const gainedScore = 100 + (timeLeft * 10);
                score += gainedScore;
                document.getElementById('score-val').textContent = score;
                msgEl.textContent = `【正解！】 偽物を見破りました！（+${gainedScore}pt）\n理由: ${fakeReason}`;
                msgEl.className = 'message-area correct';
            } else {
                msgEl.textContent = `【不正解…】 それは本物です！\n理由: ${fakeReason}`;
                msgEl.className = 'message-area wrong';
            }

            showNextButton();
        }

        function timeOut() {
            isAnswered = true;
            const msgEl = document.getElementById('message');
            document.getElementById('card-left').style.pointerEvents = 'none';
            document.getElementById('card-right').style.pointerEvents = 'none';
            
            msgEl.textContent = `【時間切れ！】 偽物は ${fakeSide === 'left' ? '作品A' : '作品B'} でした。\n理由: ${fakeReason}`;
            msgEl.className = 'message-area wrong';
            
            showNextButton();
        }

        function showNextButton() {
            const btn = document.getElementById('next-btn');
            if (currentStage < TOTAL_STAGES) {
                btn.textContent = '次の鑑定へ';
            } else {
                btn.textContent = '最終結果を見る';
            }
            btn.style.display = 'inline-block';
        }

        function nextStage() {
            if (currentStage < TOTAL_STAGES) {
                currentStage++;
                document.getElementById('stage-val').textContent = currentStage;
                startStage();
            } else {
                showFinalResult();
            }
        }

        function showFinalResult() {
            let rank = "見習い鑑定士";
            if (score >= 800) rank = "伝説の神眼鑑定士";
            else if (score >= 500) rank = "一流鑑定士";
            else if (score >= 300) rank = "一人前鑑定士";

            alert(`【ゲームクリア！】\n最終スコア: ${score} pt\nあなたの称号: 『${rank}』`);
            
            currentStage = 1;
            score = 0;
            document.getElementById('stage-val').textContent = currentStage;
            document.getElementById('score-val').textContent = score;
            startStage();
        }

        startStage();
    </script>
</body>
</html>

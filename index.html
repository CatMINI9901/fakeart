<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAKE Site Fullscreen - Custom Sidebar</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
            background-color: #FFEDB3;
            display: flex;
        }

        /* --- サイドバー (左側) --- */
        .sidebar {
            width: 280px;
            height: 100vh;
            background-color: #E8EEFA; /* ご指定の画像の青色を適用 */
            border-right: 2px solid #111111;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            flex-shrink: 0;
        }

        /* プロフィール領域 */
        .profile-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            border: 3px solid #111111;
            background-color: #ffffff;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .profile-avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* サイドバー内のUIアイテム */
        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 12px;
            height: 32px;
        }

        /* SVGアイコン共通 */
        .icon-svg {
            fill: #111111;
            flex-shrink: 0;
        }

        .dots {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .dot {
            width: 10px;
            height: 10px;
            background-color: #111111;
            border-radius: 50%;
        }

        .pill {
            height: 12px;
            background-color: #111111;
            border-radius: 6px;
        }

        .divider {
            width: 100%;
            height: 2px;
            background-color: #111111;
            margin: 6px 0;
            opacity: 0.5;
        }

        /* --- メインコンテンツエリア (右側全画面) --- */
        .main-content {
            flex: 1;
            height: 100vh;
            background-color: #ffffff;
            background-size: 24px 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* 爆発型スターバーストバナー */
        .starburst-container {
            width: 82vw;
            max-width: 1100px;
            height: 75vh;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .starburst-svg {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            filter: drop-shadow(4px 6px 0px rgba(0,0,0,0.15));
        }

        /* メインの FAKE テキスト */
        .fake-text {
            position: relative;
            z-index: 10;
            font-family: "Arial Black", "Impact", sans-serif;
            font-size: clamp(8rem, 18vw, 22rem);
            font-weight: 900;
            color: #FF002B;
            letter-spacing: -0.02em;
            line-height: 1;
            text-align: center;
            user-select: none;
        }

        .tool-shape {
            background-color: #111111;
        }

        .tool-circle {
            width: 18px;
            height: 18px;
            border-radius: 50%;
        }

        .tool-wave {
            width: 32px;
            height: 6px;
            border-radius: 3px;
        }

        .tool-rect1 {
            width: 36px;
            height: 16px;
            border-radius: 2px;
        }

        .tool-rect2 {
            width: 42px;
            height: 16px;
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <!-- サイドバー -->
    <aside class="sidebar">
        <!-- アバター写真 -->
        <div class="profile-container">
            <svg class="profile-avatar" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="100" height="100" fill="#B3EFFF"/>
                <circle cx="50" cy="38" r="18" fill="#0099FF"/>
                <path d="M20 88C20 68 33 60 50 60C67 60 80 68 80 88V100H20V88Z" fill="#0033CC"/>
            </svg>
        </div>

        <!-- メール & チャット風アイコン列 1 -->
        <div class="sidebar-item">
            <svg class="icon-svg" width="22" height="18" viewBox="0 0 24 18"><path d="M20 0H4C1.8 0 0 1.8 0 4V14C0 16.2 1.8 18 4 18H20C22.2 18 24 16.2 24 14V4C24 1.8 22.2 0 20 0ZM20 4L12 9L4 4H20Z"/></svg>
            <svg class="icon-svg" width="20" height="20" viewBox="0 0 24 24"><path d="M20 2H4C2.9 2 2 2.9 2 4V22L6 18H20C21.1 18 22 17.1 22 16V4C22 2.9 21.1 2 20 2Z"/></svg>
            <div class="dot"></div>
        </div>

        <!-- アイコン列 2 -->
        <div class="sidebar-item">
            <div class="dot" style="width:16px; height:16px;"></div>
            <svg class="icon-svg" width="22" height="18" viewBox="0 0 24 24"><path d="M16 11C17.66 11 18.99 9.66 18.99 8C18.99 6.34 17.66 5 16 5C14.34 5 13 6.34 13 8C13 9.66 14.34 11 16 11ZM8 11C9.66 11 10.99 9.66 10.99 8C10.99 6.34 9.66 5 8 5C6.34 5 5 6.34 5 8C5 9.66 6.34 11 8 11ZM8 13C5.67 13 1 14.17 1 16.5V19H15V16.5C15 14.17 10.33 13 8 13ZM16 13C15.71 13 15.38 13.02 15.03 13.05 C16.19 13.89 17 15.02 17 16.5V19H23V16.5C23 14.17 18.33 13 16 13Z"/></svg>
            <div class="dot" style="width:14px; height:14px;"></div>
        </div>

        <!-- アイコン列 3 -->
        <div class="sidebar-item">
            <svg class="icon-svg" width="22" height="18" viewBox="0 0 24 18"><path d="M20 0H4C1.8 0 0 1.8 0 4V14C0 16.2 1.8 18 4 18H20C22.2 18 24 16.2 24 14V4C24 1.8 22.2 0 20 0ZM20 4L12 9L4 4H20Z"/></svg>
            <div class="dots">
                <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
            </div>
        </div>

        <div class="divider"></div>

        <!-- アイコン列 4 -->
        <div class="sidebar-item">
            <svg class="icon-svg" width="22" height="18" viewBox="0 0 24 18"><path d="M20 0H4C1.8 0 0 1.8 0 4V14C0 16.2 1.8 18 4 18H20C22.2 18 24 16.2 24 14V4C24 1.8 22.2 0 20 0ZM20 4L12 9L4 4H20Z"/></svg>
            <div class="dots">
                <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
            </div>
        </div>

        <!-- アイコン列 5 -->
        <div class="sidebar-item">
            <div class="dot"></div>
            <div class="pill" style="width: 100px;"></div>
            <div class="dot"></div>
        </div>

        <!-- アイコン列 6 -->
        <div class="sidebar-item">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <!-- アイコン列 7 -->
        <div class="sidebar-item">
            <div class="pill" style="width: 80px;"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <!-- アイコン列 8 -->
        <div class="sidebar-item">
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </aside>

    <!-- メイン領域 -->
    <main class="main-content">
        <div class="starburst-container">
            <svg class="starburst-svg" viewBox="0 0 600 420" preserveAspectRatio="none">
                <polygon points="
                    300,5  345,70  410,20  425,95  500,60  485,140 575,135 525,200 
                    590,265 505,285 530,365 445,340 430,415 355,360 300,415 245,360 
                    170,415 155,340 70,365 95,285 10,265 75,200 25,135 115,140 
                    100,60 175,95 190,20 255,70
                " fill="#FFF200" stroke="#FFF200" stroke-width="2" />
            </svg>

            <!-- 主張の強い FAKE テキスト -->
            <h1 class="fake-text">FAKE</h1>
        </div>
    </main>
</body>
</html>

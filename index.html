<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Number Guessing Game with Ranking</title>
  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #1e1e24;
      --accent-color: #00e676;
      --text-color: #e0e0e0;
      --border-color: #33333f;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      border: 1px solid var(--border-color);
    }

    h1, h2 {
      text-align: center;
      margin-top: 0;
    }

    h1 { color: var(--accent-color); }

    .game-box, .ranking-box {
      margin-bottom: 24px;
      background: rgba(0,0,0,0.2);
      padding: 16px;
      border-radius: 8px;
    }

    input[type="number"], input[type="text"] {
      width: 100%;
      padding: 12px;
      margin: 8px 0 16px 0;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: #2a2a36;
      color: #fff;
      font-size: 1rem;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: var(--accent-color);
      color: #000;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover { opacity: 0.9; }
    button:disabled { background: #555; cursor: not-allowed; }

    #message {
      text-align: center;
      font-weight: bold;
      min-height: 1.5em;
      margin: 10px 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      padding: 8px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }

    th { color: var(--accent-color); }

    .hidden { display: none; }
  </style>
</head>
<body>

<div class="container">
  <h1>1-100 数字当てゲーム</h1>

  <div class="game-box">
    <p>1から100までの数字を当ててください。<br>少ない試行回数（スコア）でクリアを目指そう！</p>
    
    <div id="play-area">
      <input type="number" id="guess-input" min="1" max="100" placeholder="数字を入力...">
      <button id="guess-btn" onclick="makeGuess()">推測する</button>
    </div>

    <div id="result-area" class="hidden">
      <p>クリア！ 試行回数: <span id="final-score"></span>回</p>
      <input type="text" id="player-name" maxlength="10" placeholder="名前を入力 (最大10文字)">
      <button id="submit-btn" onclick="submitScore()">スコアを送信</button>
      <button onclick="resetGame()" style="margin-top: 8px; background: #666; color: #fff;">もう一度遊ぶ</button>
    </div>

    <div id="message"></div>
  </div>

  <div class="ranking-box">
    <h2>🏆 オンラインランキング TOP 10</h2>
    <table id="ranking-table">
      <thead>
        <tr>
          <th>順位</th>
          <th>名前</th>
          <th>回数</th>
        </tr>
      </thead>
      <tbody id="ranking-body">
        <tr><td colspan="3" style="text-align:center;">読み込み中...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  // ★ ここにGASのウェブアプリURLを貼り付けます
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwFhN5ENO7_Ba9A45QNO710Bx18SMsi-HDhEwQtrAr66-u0MANW3XhgW1-hnl_uSycp/exec";

  let targetNumber;
  let attempts = 0;
  let isGameOver = false;

  function initGame() {
    targetNumber = Math.floor(Math.random() * 100) + 1;
    attempts = 0;
    isGameOver = false;
    document.getElementById("guess-input").value = "";
    document.getElementById("message").textContent = "ゲームスタート！";
    document.getElementById("play-area").classList.remove("hidden");
    document.getElementById("result-area").classList.add("hidden");
    document.getElementById("guess-btn").disabled = false;
  }

  function makeGuess() {
    if (isGameOver) return;

    const input = document.getElementById("guess-input");
    const guess = parseInt(input.value);

    if (isNaN(guess) || guess < 1 || guess > 100) {
      document.getElementById("message").textContent = "1〜100の有効な数字を入力してください。";
      return;
    }

    attempts++;

    if (guess === targetNumber) {
      isGameOver = true;
      document.getElementById("message").textContent = "🎉 正解です！";
      document.getElementById("final-score").textContent = attempts;
      document.getElementById("play-area").classList.add("hidden");
      document.getElementById("result-area").classList.remove("hidden");
    } else if (guess < targetNumber) {
      document.getElementById("message").textContent = "📈 もっと大きいです！";
    } else {
      document.getElementById("message").textContent = "📉 もっと小さかった！";
    }
    input.value = "";
  }

  async function submitScore() {
    const nameInput = document.getElementById("player-name");
    const name = nameInput.value.trim() || "Anonymous";
    const submitBtn = document.getElementById("submit-btn");

    submitBtn.disabled = true;
    document.getElementById("message").textContent = "スコア送信中...";

    try {
      // GAS側でCORS回避のため text/plain で送るテクニックを使用
      await fetch(GAS_WEB_APP_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ name: name, score: attempts })
      });

      document.getElementById("message").textContent = "送信完了！";
      nameInput.value = "";
      setTimeout(fetchRanking, 1000); // ランキング再取得
    } catch (err) {
      document.getElementById("message").textContent = "送信に失敗しました。";
      submitBtn.disabled = false;
    }
  }

  async function fetchRanking() {
    const tbody = document.getElementById("ranking-body");
    try {
      const res = await fetch(GAS_WEB_APP_URL);
      const data = await res.json();

      tbody.innerHTML = "";
      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">データがありません</td></tr>';
        return;
      }

      data.forEach((item, index) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${index + 1}</td>
          <td>${escapeHtml(item.name)}</td>
          <td>${item.score}回</td>
        `;
        tbody.appendChild(tr);
      });
    } catch (err) {
      tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">ランキング取得失敗</td></tr>';
    }
  }

  function resetGame() {
    initGame();
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function(m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
    });
  }

  // 初開時にゲーム初期化とランキング取得
  initGame();
  fetchRanking();
</script>

</body>
</html>
